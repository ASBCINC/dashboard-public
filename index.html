<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#140a26;--panel:#1c1038;--cyan:#2de2e6;--pink:#ff2975;--yellow:#ffe600;--green:#3fda6b;--text:#eae6ff;--dim:#9c8fc7;--red:#ff5555;--blue:#4db2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:20px/1.35 'VT323',monospace}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);z-index:99}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:'Press Start 2P';font-size:21px;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);margin:6px 0 2px;text-align:center;letter-spacing:1px}
.sub{color:var(--dim);font-size:17px;text-align:center;margin-bottom:16px}
.panel{border:3px solid var(--cyan);background:var(--panel);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--pink),0 0 18px rgba(45,226,230,.25);margin-bottom:22px;padding:0}
.ph{font-family:'Press Start 2P';font-size:12px;color:var(--cyan);text-shadow:2px 2px 0 #083d3e;padding:10px 14px;border-bottom:3px solid var(--cyan);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pb{padding:12px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:2px solid var(--cyan)}
.mtitle{font-family:'Press Start 2P';font-size:13px;color:var(--yellow)}
.navb{font-family:'Press Start 2P';font-size:12px;background:none;border:2px solid var(--pink);color:var(--pink);padding:5px 9px;cursor:pointer}
.navb:hover{color:var(--yellow);border-color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 12px}
.gd{font-family:'Press Start 2P';font-size:9px;color:var(--dim);text-align:center;padding:4px 0}
.cell{min-height:46px;border:2px solid #35215e;padding:3px 4px;cursor:pointer;position:relative}
.cell.off{opacity:.25;cursor:default}
.cell.today{border-color:var(--yellow)}
.cell.sel{background:#33206b;outline:2px solid var(--yellow)}
.dnum{font-family:'Press Start 2P';font-size:9px;color:var(--text)}
.dot{width:6px;height:6px;display:inline-block;margin:1px}
.dot.w{background:var(--red)}.dot.p{background:var(--yellow)}.dot.h{background:var(--blue)}
.daylist{border-top:2px solid var(--cyan);padding:8px 14px;min-height:26px}
.daylist .ev{display:flex;gap:10px;font-size:19px;margin:2px 0}
.daylist .tm{color:var(--dim);min-width:76px}
.daylist .w{color:var(--red)}.daylist .p{color:var(--yellow)}.daylist .h{color:var(--blue)}
.daylist .et.w{color:var(--red)}.daylist .et.p{color:var(--yellow)}.daylist .et.h{color:var(--blue)}
/* tasks */
.titem{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #4a2f8a}
.titem:last-child{border-bottom:none}
.pxbox{width:20px;height:20px;flex:none;border:2px solid var(--cyan);background:#0d0620;cursor:pointer;margin-top:3px;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.pxbox.on{background:var(--green);border-color:var(--green)}
.pxbox.on::after{content:'\2713';color:#04270f;font-family:'Press Start 2P';font-size:10px;display:block;text-align:center;margin-top:2px}
.tt{flex:1}
.ttitle{font-size:20px}
.titem.done .ttitle{text-decoration:line-through;color:var(--dim)}
.tdetail{color:var(--dim);font-size:16px}
.tdue{color:var(--yellow);font-size:16px;white-space:nowrap}
/* chat */
.chatlog{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:82%;padding:6px 10px;border:2px solid;font-size:19px;line-height:1.25;word-break:break-word}
.msg.you{align-self:flex-end;border-color:var(--pink);background:#2a0f22}
.msg.fo{align-self:flex-start;border-color:var(--cyan);background:#0c2430}
.msg .who{font-family:'Press Start 2P';font-size:8px;display:block;margin-bottom:3px;color:var(--dim)}
/* memorable */
.mem{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #4a2f8a}
.mem:last-child{border-bottom:none}
.star{color:var(--yellow);font-size:20px}
.mtext{flex:1;font-size:20px}
.mtext.w{color:var(--cyan)}.mtext.p{color:var(--pink)}
.x{color:var(--dim);cursor:pointer;font-family:'Press Start 2P';font-size:10px;padding:4px}
.x:hover{color:var(--pink)}
.addrow{display:flex;gap:8px;margin-top:10px}
input.pin,input.addt{background:#0d0620;border:2px solid var(--cyan);color:var(--text);font:20px 'VT323',monospace;padding:6px 10px;flex:1}
input.pin:focus,input.addt:focus{outline:2px solid var(--yellow)}
.addb{font-family:'Press Start 2P';font-size:10px;background:var(--pink);color:#fff;border:none;padding:8px 12px;cursor:pointer}
.addb:hover{background:var(--yellow);color:#1c1038}
#gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#gate .gt{font-family:'Press Start 2P';font-size:16px;color:var(--pink);text-shadow:2px 2px 0 var(--cyan)}
#gate .ge{font-family:'Press Start 2P';font-size:10px;color:var(--yellow)}
#gate input{width:104px;height:44px;flex:none;text-align:center;font-size:26px;letter-spacing:6px}
#gate button{margin-top:6px}
#stamp{color:var(--dim);text-align:center;font-size:16px}
footer{font-family:'Press Start 2P';font-size:9px;color:var(--dim);text-align:center;margin-top:26px}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.evlink{color:var(--yellow);font-size:15px;text-decoration:none;margin-left:6px}
.evlink:hover{color:var(--green)}
#evmodal{display:none;position:fixed;inset:0;background:rgba(8,3,20,.85);z-index:200;align-items:center;justify-content:center;padding:16px}
.evbox{width:100%;max-width:520px;border:3px solid var(--yellow);background:var(--panel);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--cyan)}
.evform{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.evform input,.evform select{width:100%;background:#0d0620;color:var(--text);border:2px solid var(--cyan);font:18px 'VT323',monospace;padding:6px 8px}
.evrow{display:flex;gap:8px}.evrow>*{flex:1}

/* alert banner */
#banner{display:flex;align-items:center;background:#1a0a14;border-top:2px solid var(--pink);border-bottom:2px solid var(--pink);padding:3px 10px;gap:10px;min-height:26px;overflow:hidden}
#banner .btag{font-family:'Press Start 2P';font-size:8px;color:#fff;background:var(--pink);padding:3px 6px;flex:none;animation:bblink 1s steps(1) infinite}
#banner .btrack{flex:1;overflow:hidden;white-space:nowrap}
#banner .btext{display:inline-block;font-family:'VT323',monospace;font-size:16px;color:var(--yellow);letter-spacing:1px;animation:bscroll 18s linear infinite}
#banner.idle{border-color:rgba(45,226,230,.4)}
#banner.idle .btag{background:var(--cyan);color:#000;animation:none}
#banner.idle .btext{color:var(--dim);animation:bscroll 26s linear infinite}
@keyframes bscroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes bblink{50%{opacity:.25}}
.rfund{margin:8px 0}
.rline{display:flex;justify-content:space-between;font-size:19px;gap:10px}
.rbar{height:10px;background:#0d0620;border:2px solid var(--cyan);margin-top:3px}
.rfill{height:100%}
.rsub{font-family:'Press Start 2P';font-size:9px;color:var(--yellow);margin:14px 0 4px}
.rbill{display:flex;justify-content:space-between;font-size:19px;padding:2px 0;border-bottom:1px solid rgba(156,143,199,.2)}
.trow{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:10px;color:var(--cyan);padding:3px 0;border-bottom:1px solid rgba(156,143,199,.2)}
.tval{color:var(--yellow)}
</style>

function catOf(e){if(!e)return 'w';if(e.cat==='holiday')return 'h';const t=(e.title||'').toLowerCase();for(const n of HOLIDS){if(t.indexOf(n)>=0)return 'h'}return e.cat[0]||'w'}

function openAddEv(){$('evmodal').style.display='flex';$('evdate').value=sel||iso(new Date());$('evstart').innerHTML=timeOpts();$('evend').innerHTML=timeOpts();$('evstart').value='09:00';$('evend').value='10:00';$('evp').innerHTML='<option value="">(no project)</option>'+Object.keys(DTP).map(k=>'<option>'+k+'</option>').join('');$('evstat').textContent='';$('evname').value='';$('evloc').value='';$('evatt').value=''}
function closeAddEv(){$('evmodal').style.display='none'}
function submitAddEv(){const name=$('evname').value.trim(),date=$('evdate').value,start=$('evstart').value,end=$('evend').value,loc=$('evloc').value.trim(),att=$('evatt').value.trim(),proj=$('evp').value;if(!name||!date||!start||!end){$('evstat').textContent='NAME, DATE, START AND END REQUIRED';return}
const rec={name:name,date:date,start:start,end:end,location:loc,attendees:att,project:proj,ts:Date.now(),status:'new'};
if(fb){fb.child('dtools_events').push(rec);$('evstat').textContent='SENT TO FO. WILL BE IN D-TOOLS AFTER THE NEXT SWEEP.';setTimeout(closeAddEv,1600)}else{$('evstat').textContent='OFFLINE: FIREBASE NOT CONNECTED, TRY AGAIN'}}

/* SFX + T-MINUS + QUICK NOTE (added Oct 27 2026) */
let actx=null;
function sfx(f){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f||880;g.gain.value=.04;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.07)}catch(e){}}
document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('button'))sfx()});
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseBillDue(s){s=s||'';const iso=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3],17,0,0);const m=/([A-Za-z]{3})\s+(\d{1,2})/.exec(s);if(!m)return null;const mo=MONTHS[m[1].toLowerCase()];if(mo==null)return null;const n=new Date();const y=n.getFullYear();let d=new Date(y,mo,+m[2],17,0,0);if(d<=n)d=new Date(y+1,mo,+m[2],17,0,0);return d}
function nextTargets(){const out=[];const now=new Date();(DATA.bills||[]).forEach(b=>{const d=parseBillDue(b.due||'');if(d)out.push({label:b.name,d})});(DATA.tasks||[]).forEach(t=>{if(!t||!t.due||isDone(t.n))return;const d=parseBillDue(t.due);if(d&&d>now){const l=String(t.title||'task');out.push({label:l.length>34?l.slice(0,32)+'..':l,d})}});(DATA.calendar||[]).forEach(e=>{if(e.cat==='holiday'||!e.date)return;const p=e.date.split('-');if(p.length<3||isNaN(+p[0]))return;const d=new Date(+p[0],+p[1]-1,+p[2],9,0,0);if(d>now)out.push({label:e.title||'event',d})});out.sort((a,b)=>a.d-b.d);return out.slice(0,3)}
function renderTminus(){const el=$('tminus');if(!el)return;const ts=nextTargets();el.innerHTML=ts.map(t=>{const ms=t.d-Date.now();if(ms<=0)return '';const dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4),ss=Math.floor(ms%6e4/1e3);const z=x=>String(x).padStart(2,'0');return '<div class="trow"><span>'+esc(t.label)+'</span><span class="tval">T-'+dd+'D '+z(hh)+':'+z(mm)+':'+z(ss)+'</span></div>'}).join('')}
setInterval(renderTminus,1000);
function saveNote(){const v=$('notein').value.trim();if(!v)return;if(!fb){$('notenote').textContent='NEEDS FIREBASE';return}fb.child('notes').push({text:v.slice(0,500),ts:Date.now()});$('notein').value='';$('notenote').textContent='SENT TO FO';setTimeout(()=>{const n=$('notenote');if(n)n.textContent=''},4000)}
/* PUSH NOTIFY (added Oct 27 2026) */
const VAPID_PUB='BBuzCk2pHlJYrXGqxPjLfKq9rnGIQsGFGTGZ5aN_0YqcXHNrn7YGzx_LlY6JiDo4AtUjhzm6DGDJRXah0I_O4U4';
let pushSub=null;
function u8(s){const p='='.repeat((4-s.length%4)%4);const b=(s+p).replace(/-/g,'+').replace(/_/g,'/');const r=atob(b);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function initNotify(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)){const b=$('notifybtn');if(b)b.textContent='NO PUSH';return}const reg=await navigator.serviceWorker.ready;pushSub=await reg.pushManager.getSubscription();const b=$('notifybtn');if(b)b.textContent=pushSub?'NOTIFY OFF':'NOTIFY ON'}catch(e){}}
async function toggleNotify(){sfx();try{const reg=await navigator.serviceWorker.ready;if(pushSub){await pushSub.unsubscribe();pushSub=null;$('notifybtn').textContent='NOTIFY ON';return}const perm=await Notification.requestPermission();if(perm!=='granted'){$('notifybtn').textContent='BLOCKED';return}pushSub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUB)});if(fb)fb.child('push_subs').push(pushSub.toJSON());$('notifybtn').textContent='NOTIFY OFF'}catch(e){$('notifybtn').textContent='NOTIFY ON'}}
initNotify();
/* storage: firebase when configured, else localStorage */
function fbInit(){
  if(!FB_CONFIG)return;
  const a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';a.onload=loadDb;document.head.appendChild(a);
  function loadDb(){const b=document.createElement('script');b.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';b.onload=go;document.head.appendChild(b)}
  function go(){try{firebase.initializeApp(FB_CONFIG);fb=firebase.database().ref('dash/'+pin);const pre=LSN+'done_';fb.child('done').on('value',s=>{const v=s.val()||{};for(const k in v)localStorage.setItem(pre+k,v[k]?'1':'0');for(const k in localStorage)if(k.startsWith(pre)&&!(k.slice(pre.length) in v))localStorage.removeItem(k);render()},e=>console.warn(e));fb.child('mem').on('value',s=>{const v=s.val();if(v==null){fb.child('mem').set(seedMem())}else{localStorage.setItem(LSN+'mem',JSON.stringify(v));render()}},e=>console.warn(e))}catch(e){console.warn(e)}}
}
function seedMem(){const m=DATA.memorable||[];return m.length?m:null}
function getMem(){try{return JSON.parse(localStorage.getItem(LSN+'mem'))||[]}catch(e){return[]}}
function setMem(list){localStorage.setItem(LSN+'mem',JSON.stringify(list));if(fb)fb.child('mem').set(list)}
function isDone(n){return localStorage.getItem(LSN+'done_'+n)==='1'}
function setDone(n,v){localStorage.setItem(LSN+'done_'+n,v?'1':'0');if(fb){fb.child('done').child(String(n)).set(v?true:null);if(v){const t=(DATA.tasks||[]).find(x=>x.n===n);fb.child('task_done').push({n:n,url:(t&&t.url)||'',title:(t&&t.title)||'',ts:Date.now()})}}render()}
/* banner */
function renderBanner(){const b=$('banner'),t=$('btext');if(!b||!t)return;const items=(DATA.banner||[]).map(x=>x.text||x).filter(Boolean);if(!items.length){b.className='idle';t.textContent='* SYSTEM NOMINAL * NO ACTIVE ALERTS * PRESS START *'}else{b.className='';t.textContent='*** '+items.join('  ***  ')+'  ***'}}
/* pwa install + service worker */
let deferPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferPrompt=e;const b=$('installbtn');if(b)b.style.display='inline-block'});
window.addEventListener('appinstalled',()=>{deferPrompt=null;const b=$('installbtn');if(b)b.style.display='none'});
function installApp(){if(deferPrompt){deferPrompt.prompt();deferPrompt=null}else{const b=$('installbtn');if(b)b.style.display='none'}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* pin */
if(localStorage.getItem(LSN+'pin')===PIN){pin=PIN;unlock()}else{$('pinin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()})}
function tryPin(){if($('pinin').value===PIN){pin=$('pinin').value;localStorage.setItem(LSN+'pin',PIN);unlock()}else{$('.ge').textContent='WRONG PIN';$('pinin').value=''}}
function unlock(){$('gate').style.display='none';$('app').hidden=false;const n=new Date();view={y:n.getFullYear(),m:n.getMonth()};sel=iso(n);render();renderBanner();fetchData();fbInit()}
/* data */
async function fetchData(){
  try{
    const r=await fetch('https://api.github.com/gists/'+GIST+'?t='+Date.now());
    if(!r.ok){$('calnote').textContent='OFFLINE SNAP';return}
    const j=await r.json();
    const f=j.files&&(j.files['data.json']||Object.values(j.files)[0]);
    if(f&&f.content){DATA=JSON.parse(f.content);
      if(fb&&!localStorage.getItem(LSN+'memseeded')){fb.child('mem').get().then(s=>{if(s.val()==null)fb.child('mem').set(seedMem())});localStorage.setItem(LSN+'memseeded','1')}
      render();renderBanner()}
  }catch(e){$('calnote').textContent='OFFLINE SNAP'}
}
/* calendar */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mv(d){let m=view.m+d,y=view.y;if(m<0){m=11;y--}if(m>11){m=0;y++}view={y,m};render()}
function renderCal(){
  const mn=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  $('mtitle').textContent=mn[view.m]+' '+view.y;
  const first=new Date(view.y,view.m,1),start=first.getDay(),days=new Date(view.y,view.m+1,0).getDate();
  const today=iso(new Date());let h=['<div class="gd">SUN</div><div class="gd">MON</div><div class="gd">TUE</div><div class="gd">WED</div><div class="gd">THU</div><div class="gd">FRI</div><div class="gd">SAT</div>'];
  for(let i=0;i<start;i++)h.push('<div class="cell off"></div>');
  for(let d=1;d<=days;d++){const ds=view.y+'-'+String(view.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs=(DATA.calendar||[]).filter(e=>e.date===ds);
    const dots=evs.map(e=>'<span class="dot '+catOf(e)+'"></span>').join('');
    const cls='cell'+(ds===today?' today':'')+(ds===sel?' sel':'');
    h.push('<div class="'+cls+'" onclick="sel=\''+ds+'\';renderCal();renderDay()"><div class="dnum">'+d+'</div><div>'+dots+'</div></div>')}
  $('cgrid').innerHTML=h.join('');
}
function renderDay(){if(!sel)return;
  const evs=(DATA.calendar||[]).filter(e=>e.date===sel);
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(sel+'T12:00').getDay()];
  $('daylist').innerHTML='<b style="color:var(--yellow)">'+wd+' '+sel.slice(5)+'</b>'+(evs.length?'':' <span style="color:var(--dim)">- nothing scheduled</span>')+evs.map(e=>'<div class="ev"><span class="tm '+catOf(e)+'">'+esc(e.time)+'</span><span class="et '+catOf(e)+'">'+esc(e.title)+dtLink(e)+'</span></div>').join('');
}
/* tasks */
function renderTasks(){
  const mk=(list,el)=>{$(el).innerHTML=list.length?list.map(x=>'<div class="titem'+(isDone(x.n)?' done':'')+'"><div class="pxbox'+(isDone(x.n)?' on':'')+'" onclick="setDone('+x.n+','+!isDone(x.n)+')"></div><div class="tt"><div class="ttitle">'+esc(x.title)+'</div>'+(x.detail?'<div class="tdetail">'+esc(x.detail)+'</div>':'')+'</div>'+(x.due?'<div class="tdue">'+esc(x.due)+'</div>':'')+'</div>').join(''):'<div class="tdetail">nothing here.</div>'};
  mk((DATA.tasks||[]).filter(t=>t.cat==='work'&&!isDone(t.n)),'wtasks');
  mk((DATA.tasks||[]).filter(t=>t.cat==='personal'&&!isDone(t.n)),'ptasks');
}
/* memorable */
function renderMem(){
  $('mems').innerHTML=getMem().map(m=>'<div class="mem"><span class="star">&#9733;</span><span class="mtext '+m.cat[0]+'">'+esc(m.text)+'</span><span class="x" onclick="delMem(\''+m.id+'\')">X</span></div>').join('')||'<div class="tdetail">nothing here yet.</div>';
}
function addMem(){const v=$('memin').value.trim();if(!v)return;const list=getMem();list.push({id:'u'+Date.now(),cat:$('memcat').value,text:v});setMem(list);$('memin').value='';renderMem()}
function delMem(id){setMem(getMem().filter(m=>m.id!==id));renderMem()}
function chatInit(){if(!fb){$('chatnote').textContent='CHAT NEEDS FIREBASE';return}chatRef=fb.child('chat');chatRef.on('value',s=>{const v=s.val();if(v){chatData=v;renderChat()}},e=>{$('chatnote').textContent='CHAT OFFLINE'})}
function sendChat(){const v=$('chatin').value.trim();if(!v)return;if(!chatRef){$('chatnote').textContent='CHAT NEEDS FIREBASE';return}chatRef.push({from:'you',text:v.slice(0,500),ts:Date.now()});$('chatin').value=''}
function renderChat(){
  const ks=Object.keys(chatData).sort((a,b)=>(chatData[a].ts||0)-(chatData[b].ts||0)).slice(-40);
  $('chatlog').innerHTML=ks.map(k=>{const m=chatData[k];return '<div class="msg '+(m.from==='fo'?'fo':'you')+'"><span class="who">'+(m.from==='fo'?'FO':'YOU')+'</span>'+esc(m.text)+'</div>'}).join('');
  const el=$('chatlog');el.scrollTop=el.scrollHeight;
}
function fmtUSD(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function renderRamp(){
  const r=DATA.ramp,fp=$('rampfunds'),bp=$('rampbills');
  if(!r||!r.funds||!r.funds.length){fp.innerHTML='<div class="tdetail">no ramp data yet</div>';bp.innerHTML='';$('rampnote').textContent='';return}
  fp.innerHTML=r.funds.map(f=>{const pct=f.limit?Math.min(100,Math.round(f.spent/f.limit*100)):0;const col=pct>=90?'var(--red)':pct>=75?'var(--yellow)':'var(--pink)';const left=f.limit-f.spent;return '<div class="rfund" title="spent '+fmtUSD(f.spent)+' of '+fmtUSD(f.limit)+'"><div class="rline"><span>'+esc(f.name)+'</span><span>'+fmtUSD(left)+' LEFT</span></div><div class="rbar"><div class="rfill" style="width:'+pct+'%;background:'+col+'"></div></div></div>'}).join('');
  const items=r.items||[];
  bp.innerHTML=items.length?items.map(b=>'<div class="rbill"><span>'+esc(b.name)+' &middot; '+esc(b.date||'')+(b.status?' <span style="color:var(--dim)">'+esc(b.status)+'</span>':'')+'</span><span>'+(b.amount!=null&&b.amount!==''?fmtUSD(b.amount):'&mdash;')+'</span></div>').join(''):'<div class="tdetail">nothing pending</div>';
  $('rampnote').textContent='LIMITS LIVE FROM RAMP';
}
function renderBills(){const bl=(DATA.bills||[]);const eb=$('expbills');if(!eb)return;eb.innerHTML=bl.length?bl.map(b=>'<div class="rbill"><span>'+esc(b.name)+' &middot; '+esc(b.due||'')+'</span><span>'+(b.amount!=null&&b.amount!==''?fmtUSD(b.amount):'&mdash;')+'</span></div>').join(''):'<div class="tdetail">nothing due</div>'}
function render(){renderCal();renderDay();renderTasks();renderMem();renderRamp();renderTminus();$('stamp').textContent='Data updated: '+((DATA.generated_at||'').replace('T',' ').slice(0,16))}
render();
</script>
